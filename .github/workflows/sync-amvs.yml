name: Update AMV carousels from YouTube
on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-amv-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update complete AMV playlists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: '@BlazingFlamesStudio'
          # Automatically include public playlists with AMV/GMV or game titles.
          # To use exact playlists, set YOUTUBE_PLAYLIST_IDS to comma-separated playlist IDs.
          YOUTUBE_PLAYLIST_MODE: ${{ vars.YOUTUBE_PLAYLIST_MODE || 'amv' }}
          YOUTUBE_PLAYLIST_IDS: ${{ vars.YOUTUBE_PLAYLIST_IDS }}
        run: python sync_youtube.py
      - name: Publish catalog
        run: |
          if ! git diff --quiet -- videos.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add videos.json
            git commit -m 'Synchronize full YouTube playlists'
            git push
          else
            echo 'Playlist catalogue unchanged.'
          fi
