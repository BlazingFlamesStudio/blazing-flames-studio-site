name: Update AMV carousels from YouTube
on:
  push:
    branches: [main]
    paths:
      - 'sync_youtube.py'
      - 'tests/test_sync_youtube.py'
      - 'tests/oracle-catalog.test.cjs'
      - 'oracle-catalog.js'
      - 'catalog-recovery-ids.json'
      - 'amv-game.js'
      - '.github/workflows/sync-amvs.yml'
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-amv-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test catalog coverage and failure safety
        run: python -m unittest discover -s tests -p 'test_sync_youtube.py' -v
      - name: Test Oracle world and character matching
        run: node --test tests/oracle-catalog.test.cjs
      - name: Update complete AMV playlists and channel uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: '@BlazingFlamesStudio'
          # Automatically include public playlists with AMV/GMV or game titles.
          # To use exact playlists, set YOUTUBE_PLAYLIST_IDS to comma-separated playlist IDs.
          YOUTUBE_PLAYLIST_MODE: ${{ vars.YOUTUBE_PLAYLIST_MODE || 'amv' }}
          YOUTUBE_PLAYLIST_IDS: ${{ vars.YOUTUBE_PLAYLIST_IDS }}
        run: python sync_youtube.py
      - name: Report verified catalog coverage
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("catalog-health.json").read_text(encoding="utf-8"))
          lines = [
              "### Blazing Flames Studio — Catalog Coverage",
              f"- Last complete check (UTC): {data['checkedAt']}",
              f"- Catalog videos: {data['catalogVideos']}",
              f"- AMV-titled entries: {data['amvTitleMatches']}",
              f"- Confirmed channel AMVs: {data['channelAMVsVerified']}",
              f"- Channel AMVs outside curated playlists: {data['channelAMVsOutsidePlaylists']}",
              f"- Curated playlists: {data['playlistCount']}",
          ]
          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(report)
          PY
      - name: Publish verified catalog and health report safely
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp videos.json "$tmpdir/videos.json"
          cp catalog-health.json "$tmpdir/catalog-health.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            # Start from the *current* main every time to avoid rebase
            # conflicts when another scheduled sync or website edit lands.
            git fetch origin main
            git reset --hard origin/main
            # Do not roll the site back to an older full-scan result.
            if [ -f catalog-health.json ] && python -c 'import json,sys; new=json.load(open(sys.argv[1])); old=json.load(open(sys.argv[2])); sys.exit(0 if old.get("checkedAt","") >= new.get("checkedAt","") else 1)' "$tmpdir/catalog-health.json" catalog-health.json; then
              echo 'A newer or equal verified scan already exists on main.'
              exit 0
            fi
            cp "$tmpdir/videos.json" videos.json
            cp "$tmpdir/catalog-health.json" catalog-health.json
            git add videos.json catalog-health.json
            if git diff --cached --quiet; then
              echo 'Catalog and health report unchanged.'
              exit 0
            fi
            git commit -m 'Synchronize verified channel AMV catalog'
            if git push origin HEAD:main; then
              echo 'Verified catalog published successfully.'
              exit 0
            fi
            echo "Publish conflicted (attempt $attempt); refreshing main and retrying."
          done
          echo 'Could not publish after four safe retries.' >&2
          exit 1
